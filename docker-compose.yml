version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_finance_app
    restart: always
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - APP_ENV=production
      - DATABASE_URL=mysql://smart_user:smart_password@db:3306/smart_finance_db
      - SESSION_SECRET=smart_finance_tracker_production_secret_key_2026
      - SERVICES_AI_MODEL=gpt-4o-mini
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: smart_finance_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: smart_finance_db
      MYSQL_USER: smart_user
      MYSQL_PASSWORD: smart_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
