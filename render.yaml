services:
  - type: web
    name: smart-finance-tracker
    runtime: node
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push && npm start
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_URL
        fromService:
          type: web
          name: smart-finance-tracker
          property: host
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-finance-db
          property: connectionString
      - key: COOKIE_SECURE
        value: true
      - key: SERVICES_AI_SECRET
        sync: false
      - key: SERVICES_AI_MODEL
        value: gpt-4o-mini

databases:
  - name: smart-finance-db
    databaseName: smart_finance
    user: smart_finance_user
    plan: free
